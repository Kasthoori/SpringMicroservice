services:
   pgadmin:
      container_name: ms-pgadmin
      image: dpage/pgadmin4
      environment: 
         PGADMIN_DEFAULT_EMAIL: anurapkasthoori@gmail.com
         PGADMIN_DEFAULT_PASSWORD: password
      volumes:
         - pgadmin:/var/lib/pgadmin
      ports:
         - "5050:80"
      networks:
         - microservices-net
 
         
   postgres:
      container_name: ms-postgres-db
      image: postgres
      environment:
         POSTGRES_USER: admin
         POSTGRES_PASSWORD: password
         POSTGRES_DB: productdb
      volumes:
         - postgres_data:/var/lib/postgresql/data
      networks:
         - microservices-net
      ports:
         - "5432:5432"

   mongodb:
      container_name: ms-mongo-db
      image: mongo:latest
      environment:
         MONGO_INITDB_ROOT_USERNAME: $MONGO_ROOT_USERNAME
         MONGO_INITDB_ROOT_PASSWORD: $MONGO_ROOT_PASSWORD
      ports:
         - "27017:27017"
      volumes:
         - mongo:/data/db
      networks:
         - microservices-net
      restart: unless-stopped
      
   mongo-express:
      container_name: ms-mongo-express
      image: mongo-express:latest
      ports:
         - "8083:8081"
      environment:
         ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@ms-mongo-db:27017/
         ME_CONFIG_MONGODB_ADMINUSERNAME: $MONGO_ROOT_USERNAME
         ME_CONFIG_MONGODB_ADMINPASSWORD: $MONGO_ROOT_PASSWORD
         ME_CONFIG_MONGODB_SERVER: ms-mongo-db
         ME_CONFIG_MONGODB_PORT: 27017
         ME_CONFIG_BASICAUTH_USERNAME: $ME_WEB_USERNAME
         ME_CONFIG_BASICAUTH_PASSWORD: $ME_WEB_PASSWORD
      
      networks:
         - microservices-net
      restart: unless-stopped
      
         
   mail-dev:
      container_name: ms-mail-dev
      image: maildev/maildev:latest
      ports:
         - "1080:1080"
         - "1025:1025"
      networks:
         - microservices-net
      restart: unless-stopped
                
           
networks:
   microservices-net:
      driver: bridge
      name: microservices-net
         
volumes:
   postgres_data:
   pgadmin:
   mongo:
 
         
   
         